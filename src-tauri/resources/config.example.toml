# DesktopPet Configuration
# Fill in your own LLM API key below.
# All models are user-supplied; no keys are bundled.

[llm]
# OpenAI-compatible base URL.
# DeepSeek: https://api.deepseek.com/v1
# OpenAI:   https://api.openai.com/v1
# Ollama:   http://localhost:11434/v1
base_url = "https://api.deepseek.com/v1"
api_key = ""
# DeepSeek V4: pro = strongest (main chat); flash = cheap/fast (reflection, Principle 8).
main_model = "deepseek-v4-pro"
reflection_model = "deepseek-v4-flash"

[embedding]
# Directory for BGE-M3 ONNX weights (int8 quantized set, ~570MB).
# Leave empty to use the default location under the app data dir
# (first run downloads it via the setup wizard).
model_dir = ""
model_name = "bge-m3"

[app]
# SQLite database path. Empty = default location in app data dir.
db_path = ""
debug = true
log_level = "info"

[perception]
# Each perception layer can be independently disabled (Architecture Principle 6).
# When disabled, the layer returns neutral defaults instead of querying the OS.
enable_time = true
enable_presence = true
enable_window = true

[scheduler]
# Scheduled Soul/cleanup "capability" toggles (Architecture Principle 6).
# Turning one off degrades gracefully: "关掉 reflection, 记忆照常" — she just
# stops doing that one background job. Core aliveness (emotion homeostasis,
# pending-event check, emotion push) is NOT listed here — disabling those kills
# her, which is not graceful. See lifecycle/scheduler.rs + ADR 2026-08-08.
enable_reflection = true          # daily self-reflection → internal thoughts
enable_consolidation = true       # compress >100 episodes into landmark memories
enable_relationship_review = true # periodic "where the relationship stands" summary
enable_lifecycle_cleanup = true   # purge old low-importance episodes
enable_rituals = true             # 早安/晚安 (first meeting / day close) greetings
# enable_weekly_summary = false  # Sunday weekly recap — OFF: friends don't recap weekly (2026-08-16)
# enable_landmarks = true        # relationship milestones (7/30/100 days …)

[tools]
# Tool Layer. get_time / open_url are harmless (always on, no switch).
# search_web / open_application can be turned off — disabling degrades
# gracefully ("关掉 search, 她照常聊天, 只是不能搜"). See tools/mod.rs.
enable_search_web = true
enable_open_application = true

[prompt]
# Soul v2 (2026-08-15): near-end directive — time/mood/intent injected as a
# trailing system message after the conversation history (the recency-weighted
# steering slot, CCv2 post_history_instructions). false = v1 layout (rollback
# without rebuild).
near_end_directive = true

[proactive]
# min_interval_secs = 3600      # proactive bubble minimum interval (seconds)
# memory_bubble_ratio = 15       # % of no-pending bubbles anchoring a memory
# enable_llm_selector = true     # LLM (flash) judges whether/which memory surfaces; false = mechanical round-robin
